[package]
name = "soundpipe"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
cpal = "0.17"
hound = "3.5"
ratatui = "0.29"
ringbuf = "0.5.2"
serde = { version = "1.0.229", features = ["derive"] }
symphonia = { version = "0.6.1", features = ["all"] }
toml = "1.1.6"

[[bin]]
name = "sp"
path = "src/main.rs"
